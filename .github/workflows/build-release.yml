name: Build and Release

on:
  push:
    branches: [main, feat/*]
    tags: ['v*']

# Allow creating releases from the Actions tab
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-agents-dist
          path: dist/

      # Create a GitHub Release on tag pushes (e.g. v1.0.0-pi-crew)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          generate_release_notes: true